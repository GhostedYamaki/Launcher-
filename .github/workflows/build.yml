name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip OneUILauncher.zip
      - run: gradle assembleRelease
        working-directory: OneUILauncher
      - uses: actions/upload-artifact@v4
        with:
          name: OneUILauncher-apk
          path: OneUILauncher/app/build/outputs/apk/release/*.apk
